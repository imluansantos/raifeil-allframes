              - { label: "Idioma", name: "idioma", widget: "string" }
              - { label: "Animações", name: "animacoes", widget: "string" }
              - { label: "Cursor", name: "cursor", widget: "string" }
          - label: "Seção Tema"
            name: "theme"
            widget: "object"
            fields:
              - { label: "Modo claro", name: "light", widget: "string" }
              - { label: "Modo escuro", name: "dark", widget: "string" }
