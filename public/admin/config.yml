              - { label: "Texto pequeno", name: "eyebrow", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "text" }
              - { label: "Rótulo \"projetos documentados\"", name: "statsProjects", widget: "string" }
              - { label: "Rótulo \"categorias\"", name: "statsCategories", widget: "string" }
          - label: "Grade de projetos"
            name: "grid"
            widget: "object"
            fields:
              - { label: "Mensagem — nenhum projeto na categoria", name: "empty", widget: "string" }
          - label: "Filtros"
            name: "filters"
            widget: "object"
            fields:
              - { label: "Rótulo \"Filtrar por categoria\"", name: "label", widget: "string" }
              - { label: "Acessibilidade do filtro", name: "ariaLabel", widget: "string" }
              - { label: "Opção \"Todos\"", name: "all", widget: "string" }
          - label: "Cartão de projeto"
            name: "card"
            widget: "object"
            fields:
              - { label: "Botão \"Ver projeto\"", name: "viewProject", widget: "string" }
          - label: "Página inicial do portfólio"
            name: "index"
            widget: "object"
            fields:
              - { label: "Título da aba do navegador", name: "metaTitle", widget: "string" }
              - { label: "Descrição pra buscadores", name: "metaDescription", widget: "text" }
              - { label: "Texto pequeno da chamada final", name: "ctaEyebrow", widget: "string" }
              - { label: "Título da chamada final", name: "ctaTitle", widget: "string" }
              - { label: "Botão da chamada final", name: "ctaButton", widget: "string" }
          - label: "Página de cada projeto"
            name: "detail"
            widget: "object"
            fields:
              - { label: "Botão \"Portfólio\"", name: "backLabel", widget: "string" }
              - label: "Nomes das especificações técnicas"
                name: "specLabels"
                widget: "object"
                fields:
                  - { label: "CPU", name: "cpu", widget: "string" }
                  - { label: "GPU", name: "gpu", widget: "string" }
                  - { label: "RAM", name: "ram", widget: "string" }
                  - { label: "Armazenamento", name: "storage", widget: "string" }
                  - { label: "Refrigeração", name: "cooling", widget: "string" }
                  - { label: "Placa-mãe", name: "motherboard", widget: "string" }
                  - { label: "Gabinete", name: "case", widget: "string" }
              - { label: "Texto pequeno \"O projeto\"", name: "projectEyebrow", widget: "string" }
              - { label: "Texto pequeno \"Specs\"", name: "specsEyebrow", widget: "string" }
              - { label: "Aviso sobre as specs", name: "specsDisclaimer", widget: "text" }
              - { label: "Texto pequeno \"Galeria\"", name: "galleryEyebrow", widget: "string" }
              - { label: "Texto pequeno \"Outros projetos\"", name: "otherProjectsEyebrow", widget: "string" }
              - { label: "Texto pequeno da chamada final", name: "ctaEyebrow", widget: "string" }
              - { label: "Título da chamada final", name: "ctaTitle", widget: "string" }
              - { label: "Botão da chamada final", name: "ctaButton", widget: "string" }
              - { label: "Sufixo do título da aba do navegador", name: "metaTitleSuffix", widget: "string" }
              - { label: "Título da aba — projeto não encontrado", name: "metaNotFoundTitle", widget: "string" }
              - label: "Projeto não encontrado (erro 404)"
                name: "notFound"
                widget: "object"
                fields:
                  - { label: "Selo", name: "eyebrow", widget: "string" }
                  - { label: "Título", name: "title", widget: "string" }
                  - { label: "Texto (mantenha {{slug}} no texto)", name: "text", widget: "text" }
                  - { label: "Link \"Voltar ao portfólio\"", name: "backLink", widget: "string" }
          - label: "Textos de cada build (fotos e specs técnicas não são editáveis aqui)"
            name: "projects"
            widget: "object"
            fields:
              - label: "Polar"
                name: "polar"
                widget: "object"
                fields: &portfolioProjectFields
                  - { label: "Descrição curta (aparece no cartão)", name: "shortDescription", widget: "text" }
                  - { label: "Descrição completa (aparece na página do projeto)", name: "description", widget: "text" }
                  - { label: "Objetivo do projeto", name: "objective", widget: "text" }
                  - {
                      label: "Foto de capa do projeto",
                      name: "coverImage",
                      widget: "image",
                      required: false,
                      media_folder: "/public/uploads/portfolio",
                      public_folder: "/uploads/portfolio",
                    }
              - label: "AllFrames Ultra 1"
                name: "allframes-ultra1"
                widget: "object"
                fields: *portfolioProjectFields
              - label: "Aurora"
                name: "aurora"
                widget: "object"
                fields: *portfolioProjectFields
              - label: "PC Blueout"
                name: "pc-blueout"
                widget: "object"
                fields: *portfolioProjectFields
              - label: "Snow Build"
                name: "snow-build"
                widget: "object"
                fields: *portfolioProjectFields
              - label: "Frostline"
                name: "frostline"
                widget: "object"
                fields: *portfolioProjectFields
              - label: "Mistic"
                name: "mistic"
                widget: "object"
                fields: *portfolioProjectFields
              - label: "Glacial"
                name: "glacial"
                widget: "object"
                fields: *portfolioProjectFields
              - label: "Prism"
                name: "prism"
                widget: "object"
                fields: *portfolioProjectFields

      - name: "settings"
