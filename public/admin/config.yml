# Configuração do Decap CMS pro site da All Frames Technology.
#
# Login: usa o GitHub como backend (backend.name: github), autenticando
# através de src/routes/api/decap/auth.ts e callback.ts — dois endpoints
# pequenos no próprio site que trocam o código do GitHub por um token de
# acesso sem nunca expor o "client secret" no navegador. Só entra quem tiver
# acesso de escrita ("Write" ou mais) no repositório no GitHub — adicione
# cada pessoa em Settings > Collaborators do repositório.
#
# Escopo desta primeira versão: só os TEXTOS em português (os arquivos de
# tradução em src/i18n/locales/pt/*.json). Imagens (foto da loja, fotos da
# equipe, fotos do portfólio) e as outras 4 línguas (en/es/it/de) ainda não
# são editáveis por aqui — ficam pra uma etapa seguinte, se quiser.
#
# Ao salvar qualquer campo aqui, o Decap faz um commit direto na branch
# "main" do repositório — o mesmo de quando você roda "git push". Isso só
# atualiza o site DE VERDADE se o projeto na Vercel estiver com o deploy
# automático ligado (Vercel > Settings > Git); confirme isso antes de
# liberar o acesso pro cliente.

backend:
  name: github
  repo: imluansantos/raifeil-allframes
  branch: main
  base_url: https://allframes.vercel.app
  auth_endpoint: api/decap/auth

# Marca própria: troca a logo cor-de-rosa padrão do Decap pela logo da All
# Frames Technology, tanto na tela de login quanto no topo do painel depois
# de logado (show_in_header). O CSS de identidade visual (fundo escuro,
# fonte Inter etc.) está em admin/index.html, não aqui.
logo:
  src: /admin/logo.webp
  show_in_header: true

# Link "voltar pro site" que aparece fixo no topo do painel, depois de logado.
site_url: https://allframes.vercel.app
display_url: https://allframes.vercel.app

# Não há campos de imagem nesta versão, mas o Decap exige esses dois
# caminhos configurados mesmo assim — deixados prontos pro dia em que
# imagens entrarem no CMS.
media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: simple

locale: "pt"

collections:
  - name: "conteudo"
    label: "Textos do site"
    description: "Cada item abaixo é um texto (ou grupo de textos) que aparece em algum lugar do site. Só o português é editável aqui — as outras línguas continuam como estão."
