              - { label: "Sukuna", name: "sukuna", widget: "string" }
              - { label: "PlayStation", name: "playstation", widget: "string" }
              - { label: "\"Mais opções em breve\"", name: "comingSoon", widget: "string" }
              - { label: "Legenda geral", name: "caption", widget: "text" }
              - { label: "Título — só no computador", name: "desktopOnlyTitle", widget: "string" }
              - { label: "Descrição — só no computador", name: "desktopOnlyDescription", widget: "text" }
