                    name: "body"
                    widget: "list"
                    field: { label: "Parágrafo", name: "paragraph", widget: "text" }
          - label: "Termos de Uso"
            name: "termsOfUse"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Data de atualização", name: "updated", widget: "string" }
              - { label: "Introdução", name: "intro", widget: "text" }
              - label: "Seções"
                name: "sections"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Título da seção", name: "heading", widget: "string" }
                  - label: "Parágrafos"
                    name: "body"
                    widget: "list"
                    field: { label: "Parágrafo", name: "paragraph", widget: "text" }
