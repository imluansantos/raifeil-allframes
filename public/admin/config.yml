            name: "language"
            widget: "object"
            fields:
              - { label: "Legenda", name: "caption", widget: "text" }

      - name: "legal"
        label: "Política de Privacidade e Termos de Uso"
        file: "src/i18n/locales/pt/legal.json"
        fields:
          - label: "Cabeçalho comum das duas páginas"
            name: "chrome"
            widget: "object"
            fields:
              - { label: "Botão \"Início\"", name: "backLabel", widget: "string" }
              - { label: "\"Última atualização\" (mantenha {{date}} no texto)", name: "updatedLabel", widget: "string" }
              - { label: "Aviso legal geral", name: "disclaimer", widget: "text" }
          - label: "Política de Privacidade"
            name: "privacyPolicy"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Data de atualização", name: "updated", widget: "string" }
              - { label: "Introdução", name: "intro", widget: "text" }
              - label: "Seções"
                name: "sections"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Título da seção", name: "heading", widget: "string" }
