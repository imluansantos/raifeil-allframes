<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conteúdo do site — All Frames Technology</title>
    <!-- Painel de edição do site (Decap CMS). Só quem tem acesso de escrita
         no repositório do GitHub consegue entrar aqui — ver config.yml
         nesta mesma pasta pra entender o que dá pra editar e como o login
         funciona (src/routes/api/decap/auth.ts e callback.ts). -->
    <!-- Caminho absoluto de propósito: sem isso, o Decap busca "config.yml"
         relativo à URL atual, e se a página for acessada como "/admin" (sem
         barra no final) o navegador resolve isso pra "/config.yml" (na raiz
         do site, onde não existe nada) em vez de "/admin/config.yml" — foi
         exatamente esse o erro 404 visto em produção. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />

    <!-- Mesma fonte (Inter) do site principal, ver src/routes/__root.tsx —
         só pra tela de login e o topo do painel logado terem a mesma cara. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /*
        Identidade visual da All Frames Technology aplicada por cima do
        Decap CMS "de fábrica", sem forkar/reescrever a biblioteca nem tocar
        na autenticação. Duas camadas, de propósito:

        1) html/body — pinta o fundo da página inteira. Sempre seguro: o
           Decap não pinta nada de si mesmo em cima disso (#nc-root é
           transparente), então nunca tapa nem ilegibiliza os painéis do
           editor autenticado.

        2) [class*="StyledAuthenticationPage"] — a seção que o Decap usa POR
           DENTRO só na tela de login (confirmado inspecionando o HTML
           renderizado em produção). Ela nunca existe depois que você loga,
           então nada aqui dentro pode vazar pro editor (Salvar, Publicar,
           listagem de conteúdo etc. continuam exatamente como o Decap
           desenha por padrão). Usamos `[class*="..."]` (contém, não igual)
           porque o Decap gera um sufixo de hash novo a cada build nesse
           nome de classe — só a parte legível do meio ("StyledAuthentication
           Page", "LoginButton", "CustomIconWrapper", "GoBackButtonStyle",
           "NetlifyCreditIcon") é estável entre deploys. Se uma atualização
           futura do Decap mudar esses nomes internos, o pior que acontece é
           a tela voltar a aparecer com o visual padrão dele — nada quebra,
           é só cosmético.

        O título/frase/descrição abaixo da logo NÃO são um recurso nativo do
        Decap (o config.yml só permite trocar a logo) — são 3 elementos que
        o <script> lá embaixo insere no DOM depois que essa seção aparece,
        sem tocar no botão de login nem no link "Voltar ao site" (só lê o
        texto do botão pra deixar mais curto). Ver comentário no <script>.
      */

      html,
      body {
        /* `background-color`, não o atalho `background` — o atalho reseta
           todas as sub-propriedades não citadas (inclusive background-image)
           pro valor inicial ("none"), e como isso vinha com !important,
           cancelava silenciosamente o grid definido logo abaixo. Foi
           exatamente esse o motivo do grid não aparecer. */
        background-color: #08090b !important;
        color: #f4f5f6;
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }

      /* Textura padrão do site (grid técnico + grain), reproduzida da regra
         equivalente em src/styles.css (body, tier 1 escuro) — mesmas cores,
         mesmos tamanhos. Essa página não passa pelo build do Tailwind, então
         é a mesma receita reescrita em CSS puro em vez de reaproveitada. */
      body {
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.14) 0.4px, transparent 0.4px),
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size:
          5px 5px,
          56px 56px,
          56px 56px;
        background-position:
          2.5px 2.5px,
          0 0,
          0 0;
      }

      /* Degradês no topo e no rodapé da tela (mesma técnica de
         SectionFade.tsx): o grid vai sumindo perto das bordas, dando um
         "vinheta" suave em vez de terminar de forma seca. z-index acima do
         grid do body, mas abaixo do conteúdo do login (#nc-root, logo
         abaixo) — nunca cobre a logo/título/botão. */
      body::before,
      body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        height: 224px;
        pointer-events: none;
        z-index: 1;
      }
      body::before {
        top: 0;
        background-image: linear-gradient(to bottom, #08090b 0%, transparent 100%);
      }
      body::after {
        bottom: 0;
        background-image: linear-gradient(to top, #08090b 0%, transparent 100%);
      }

      #nc-root {
        position: relative;
        z-index: 2;
      }

      [class*="StyledAuthenticationPage"] {
        background: transparent !important;
        min-height: 100vh;
        gap: 22px !important;
        padding: 32px 24px;
        animation: af-fade-in 0.6s ease-out both;
      }

      @media (prefers-reduced-motion: reduce) {
        [class*="StyledAuthenticationPage"] {
          animation: none;
        }
      }

      @keyframes af-fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* logo da All Frames (vem de config.yml → logo.src) — discreta, só
         pra identificar a marca, sem competir com o título abaixo dela */
      [class*="StyledAuthenticationPage"] img {
        width: auto;
        height: 40px;
        max-width: 70vw;
      }

      /* título + frase + descrição inseridos via JS (ver <script>) */
      .af-login-title {
        margin: 4px 0 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f4f5f6;
        text-align: center;
      }

      .af-login-tagline {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #f4f5f6;
        text-align: center;
        opacity: 0.92;
      }

      .af-login-desc {
        margin: -8px 0 0;
        max-width: 300px;
        font-size: 12.5px;
        line-height: 1.5;
        color: #8f9397;
        text-align: center;
      }

      /* Qualificado com a tag `button` de propósito: "LoginButton" também é
         substring do <span> do ÍCONE dentro do botão
         (IconWrapper-LoginButtonIcon), que é um <span>, não um <button>. Sem
         esse filtro, o seletor pegava os dois elementos — o span do ícone
         virava um segundo "pill" branco por trás do botão de verdade, com o
         próprio padding de 14px/30px, deslocado (foi o bug do retângulo
         branco solto atrás do texto). */
      [class*="StyledAuthenticationPage"] button[class*="LoginButton"] {
        display: inline-flex !important;
        align-items: center;
        gap: 10px;
        background: #ffffff !important;
        color: #08090b !important;
        border: none !important;
        border-radius: 999px !important;
        padding: 14px 30px !important;
        font-family: inherit !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 6px 24px -8px rgba(0, 0, 0, 0.6);
        transition:
          box-shadow 0.3s ease,
          transform 0.2s ease;
      }

      [class*="StyledAuthenticationPage"] button[class*="LoginButton"]:hover {
        box-shadow: 0 6px 24px -8px rgba(0, 0, 0, 0.9);
        transform: translateY(-1px);
      }

      [class*="StyledAuthenticationPage"] [class*="LoginButton"] svg {
        fill: currentColor;
      }

      /* "Voltar ao site" — mantido, mas rebaixado visualmente (menor, mais
         apagado) pra não competir com o botão de login */
      [class*="StyledAuthenticationPage"] [class*="GoBackButtonStyle"] {
        margin-top: 6px;
        opacity: 0.55;
        transition: opacity 0.2s ease;
      }

      [class*="StyledAuthenticationPage"] [class*="GoBackButtonStyle"]:hover {
        opacity: 0.9;
      }

      [class*="StyledAuthenticationPage"] [class*="GoBackButtonStyle"] svg path {
        fill: #f4f5f6 !important;
      }

      [class*="StyledAuthenticationPage"] [class*="ButtonText"] {
        color: #f4f5f6 !important;
        font-size: 12px !important;
      }

      /* remove a marca "Decap"/logo do rodapé da tela — o cliente final não
         precisa saber qual tecnologia roda por baixo do painel */
      [class*="NetlifyCreditIcon"] {
        display: none !important;
      }

      /* mensagens de erro de login (credenciais recusadas etc.) — mantém
         legível no fundo escuro em vez do texto escuro padrão do Decap */
      [class*="StyledAuthenticationPage"] [class*="ErrorMessage"] {
        color: #f4a3a3 !important;
      }

      @media (max-width: 480px) {
        [class*="StyledAuthenticationPage"] {
          gap: 16px !important;
        }
        [class*="StyledAuthenticationPage"] img {
          height: 32px;
        }
        .af-login-title {
          font-size: 19px;
        }
        .af-login-tagline {
          font-size: 13px;
        }
        .af-login-desc {
          font-size: 12px;
          max-width: 260px;
        }
        [class*="StyledAuthenticationPage"] [class*="LoginButton"] {
          padding: 12px 24px !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // O Decap não tem um jeito nativo (via config.yml) de adicionar
      // título/frase/descrição na tela de login — só a logo é configurável.
      // Então observamos o DOM até a seção de login aparecer e inserimos
      // esses 3 elementos como IRMÃOS dos que o Decap já renderiza (entre a
      // logo e o botão), sem substituir, clonar ou desmontar nada que o
      // Decap controla. O botão de login e o link "Voltar ao site" continuam
      // sendo exatamente os elementos originais do Decap, com o mesmo
      // onClick/href de sempre — só o texto do botão é encurtado ("Entrar
      // com o GitHub" → "Entrar com GitHub"), trocando apenas o nó de texto,
      // nunca o elemento em si.
      (function () {
        function enhance(section) {
          if (section.dataset.afEnhanced) return;

          var button = section.querySelector('[class*="LoginButton"]');
          if (!button) return; // ainda não renderizou tudo, tenta de novo depois

          section.dataset.afEnhanced = "true";

          var title = document.createElement("h1");
          title.className = "af-login-title";
          title.textContent = "Central do Administrador";

          var tagline = document.createElement("p");
          tagline.className = "af-login-tagline";
          tagline.textContent = "Acesso restrito ao ambiente administrativo.";

          var desc = document.createElement("p");
          desc.className = "af-login-desc";
          desc.textContent =
            "Ambiente reservado para administradores, onde é possível gerenciar conteúdos, informações e recursos da plataforma em um único lugar, com praticidade, organização e controle.";

          button.insertAdjacentElement("beforebegin", title);
          button.insertAdjacentElement("beforebegin", tagline);
          button.insertAdjacentElement("beforebegin", desc);

          // encurta o texto do botão sem recriar o elemento (preserva o
          // onClick que o Decap já anexou nele)
          for (var i = 0; i < button.childNodes.length; i++) {
            var node = button.childNodes[i];
            if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim()) {
              node.nodeValue = "Entrar com GitHub";
              break;
            }
          }
        }

        function scan() {
          var section = document.querySelector('[class*="StyledAuthenticationPage"]');
          if (section) enhance(section);
        }

        scan();
        new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
