<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área Restrita!</title>
    <!-- Painel de edição do site (Decap CMS). Só quem tem acesso de escrita
         no repositório do GitHub consegue entrar aqui — ver config.yml
         nesta mesma pasta pra entender o que dá pra editar e como o login
         funciona (src/routes/api/decap/auth.ts e callback.ts). -->
    <!-- Caminho absoluto de propósito: sem isso, o Decap busca "config.yml"
         relativo à URL atual, e se a página for acessada como "/admin" (sem
         barra no final) o navegador resolve isso pra "/config.yml" (na raiz
         do site, onde não existe nada) em vez de "/admin/config.yml" — foi
         exatamente esse o erro 404 visto em produção. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />

    <!-- Mesma fonte (Inter) do site principal, ver src/routes/__root.tsx —
         só pra tela de login e o topo do painel logado terem a mesma cara. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /*
        Identidade visual da All Frames Technology aplicada por cima do
        Decap CMS "de fábrica", sem forkar/reescrever a biblioteca nem tocar
        na autenticação. Duas camadas, de propósito:

        1) html/body — pinta o fundo da página inteira. Sempre seguro: o
           Decap não pinta nada de si mesmo em cima disso (#nc-root é
           transparente), então nunca tapa nem ilegibiliza os painéis do
           editor autenticado.

        2) [class*="StyledAuthenticationPage"] — a seção que o Decap usa POR
           DENTRO só na tela de login (confirmado inspecionando o HTML
           renderizado em produção). Ela nunca existe depois que você loga,
           então nada aqui dentro pode vazar pro editor (Salvar, Publicar,
           listagem de conteúdo etc. continuam exatamente como o Decap
           desenha por padrão). Usamos `[class*="..."]` (contém, não igual)
           porque o Decap gera um sufixo de hash novo a cada build nesse
           nome de classe — só a parte legível do meio ("StyledAuthentication
           Page", "LoginButton", "CustomIconWrapper", "GoBackButtonStyle",
           "NetlifyCreditIcon") é estável entre deploys. Se uma atualização
           futura do Decap mudar esses nomes internos, o pior que acontece é
           a tela voltar a aparecer com o visual padrão dele — nada quebra,
           é só cosmético.

        O título/frase/descrição abaixo da logo NÃO são um recurso nativo do
        Decap (o config.yml só permite trocar a logo) — são 3 elementos que
        o <script> lá embaixo insere no DOM depois que essa seção aparece,
        sem tocar no botão de login nem no link "Voltar ao site" (só lê o
        texto do botão pra deixar mais curto). Ver comentário no <script>.

        IMPORTANTE: todo o tema escuro abaixo (fundo, grid, degradês) fica
        dentro de `html.af-login-screen` — uma classe que o <script> lá
        embaixo liga na tag <html> só enquanto a seção de login existe, e
        desliga assim que ela some (ou seja, assim que você loga). Antes essas
        regras eram em `html, body` direto, sem essa classe — funcionavam na
        tela de login, mas continuavam ativas DEPOIS de logar também, e o
        editor do Decop (que espera um fundo claro) ficava com as telas de
        edição de texto/imagem completamente pretas e sem nada visível por
        cima. Com a classe, o tema escuro nunca chega a existir fora da tela
        de login — o editor volta a usar o visual padrão dele, intacto.
      */

      html.af-login-screen,
      html.af-login-screen body {
        /* `background-color`, não o atalho `background` — o atalho reseta
           todas as sub-propriedades não citadas (inclusive background-image)
           pro valor inicial ("none"), e como isso vinha com !important,
           cancelava silenciosamente o grid definido logo abaixo. Foi
           exatamente esse o motivo do grid não aparecer. */
        background-color: #08090b !important;
        color: #f4f5f6;
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          sans-serif;
      }

      /* Textura padrão do site (grid técnico + grain), reproduzida da regra
         equivalente em src/styles.css (body, tier 1 escuro) — mesmas cores,
         mesmos tamanhos. Essa página não passa pelo build do Tailwind, então
         é a mesma receita reescrita em CSS puro em vez de reaproveitada. */
      html.af-login-screen body {
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.14) 0.4px, transparent 0.4px),
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size:
          5px 5px,
          56px 56px,
          56px 56px;
        background-position:
          2.5px 2.5px,
          0 0,
          0 0;
      }

      /* Degradês no topo e no rodapé da tela (mesma técnica de
         SectionFade.tsx): o grid vai sumindo perto das bordas, dando um
         "vinheta" suave em vez de terminar de forma seca. z-index acima do
         grid do body, mas abaixo do conteúdo do login (#nc-root, logo
         abaixo) — nunca cobre a logo/título/botão. */
      html.af-login-screen body::before,
      html.af-login-screen body::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        height: 224px;
        pointer-events: none;
        z-index: 1;
      }
      html.af-login-screen body::before {
        top: 0;
        background-image: linear-gradient(to bottom, #08090b 0%, transparent 100%);
      }
      html.af-login-screen body::after {
        bottom: 0;
        background-image: linear-gradient(to top, #08090b 0%, transparent 100%);
      }

      html.af-login-screen #nc-root {
        position: relative;
        z-index: 2;
      }

      [class*="StyledAuthenticationPage"] {
        background: transparent !important;
        min-height: 100vh;
        gap: 22px !important;
        padding: 32px 24px;
        animation: af-fade-in 0.6s ease-out both;
      }

      @media (prefers-reduced-motion: reduce) {
        [class*="StyledAuthenticationPage"] {
          animation: none;
        }
      }

      @keyframes af-fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* logo da All Frames (vem de config.yml → logo.src) — discreta, só
         pra identificar a marca, sem competir com o título abaixo dela */
      [class*="StyledAuthenticationPage"] img {
        width: auto;
        height: 40px;
        max-width: 70vw;
      }

      /* título + frase + descrição inseridos via JS (ver <script>) */
      .af-login-title {
        margin: 4px 0 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #f4f5f6;
        text-align: center;
      }

      .af-login-tagline {
        margin: 0;
        font-size: 14px;
        font-weight: 500;
        color: #f4f5f6;
        text-align: center;
        opacity: 0.92;
      }

      .af-login-desc {
        margin: -8px 0 0;
        max-width: 300px;
        font-size: 12.5px;
        line-height: 1.5;
        color: #8f9397;
        text-align: center;
      }

      /* Qualificado com a tag `button` de propósito: "LoginButton" também é
         substring do <span> do ÍCONE dentro do botão
         (IconWrapper-LoginButtonIcon), que é um <span>, não um <button>. Sem
         esse filtro, o seletor pegava os dois elementos — o span do ícone
         virava um segundo "pill" branco por trás do botão de verdade, com o
         próprio padding de 14px/30px, deslocado (foi o bug do retângulo
         branco solto atrás do texto). */
      [class*="StyledAuthenticationPage"] button[class*="LoginButton"] {
        display: inline-flex !important;
        align-items: center;
        gap: 10px;
        background: #ffffff !important;
        color: #08090b !important;
        border: none !important;
        border-radius: 999px !important;
        padding: 14px 30px !important;
        font-family: inherit !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 6px 24px -8px rgba(0, 0, 0, 0.6);
        transition:
          box-shadow 0.3s ease,
          transform 0.2s ease;
      }

      [class*="StyledAuthenticationPage"] button[class*="LoginButton"]:hover {
        box-shadow: 0 6px 24px -8px rgba(0, 0, 0, 0.9);
        transform: translateY(-1px);
      }

      [class*="StyledAuthenticationPage"] [class*="LoginButton"] svg {
        fill: currentColor;
      }

      /* "Voltar ao site" — mantido, mas rebaixado visualmente (menor, mais
         apagado) pra não competir com o botão de login */
      [class*="StyledAuthenticationPage"] [class*="GoBackButtonStyle"] {
        margin-top: 6px;
        opacity: 0.55;
        transition: opacity 0.2s ease;
      }

      [class*="StyledAuthenticationPage"] [class*="GoBackButtonStyle"]:hover {
        opacity: 0.9;
      }

      [class*="StyledAuthenticationPage"] [class*="GoBackButtonStyle"] svg path {
        fill: #f4f5f6 !important;
      }

      [class*="StyledAuthenticationPage"] [class*="ButtonText"] {
        color: #f4f5f6 !important;
        font-size: 12px !important;
      }

      /* remove a marca "Decap"/logo do rodapé da tela — o cliente final não
         precisa saber qual tecnologia roda por baixo do painel */
      [class*="NetlifyCreditIcon"] {
        display: none !important;
      }

      /* mensagens de erro de login (credenciais recusadas etc.) — mantém
         legível no fundo escuro em vez do texto escuro padrão do Decap */
      [class*="StyledAuthenticationPage"] [class*="ErrorMessage"] {
        color: #f4a3a3 !important;
      }

      @media (max-width: 480px) {
        [class*="StyledAuthenticationPage"] {
          gap: 16px !important;
        }
        [class*="StyledAuthenticationPage"] img {
          height: 32px;
        }
        .af-login-title {
          font-size: 19px;
        }
        .af-login-tagline {
          font-size: 13px;
        }
        .af-login-desc {
          font-size: 12px;
          max-width: 260px;
        }
        [class*="StyledAuthenticationPage"] [class*="LoginButton"] {
          padding: 12px 24px !important;
        }
      }

      /* =====================================================================
       * PAINEL LOGADO (depois do login) — mesma identidade visual acima,
       * agora aplicada na tela de verdade que o administrador usa no dia a
       * dia (listagem de coleções + tela de edição). Diferente da tela de
       * login (styled-components com hash instável, por isso o seletor
       * `[class*="StyledAuthenticationPage"]`), essas telas usam Emotion e
       * têm uma parte do nome de classe ESTÁVEL só que HOJE (versão
       * decap-cms@3.x) — ex: "css-t7s16-AppHeaderSiteLink-AppHeaderLink-...".
       * O hash no início/meio muda a cada build, mas o pedaço legível
       * (AppHeader, SidebarContainer, ListCard, ControlPaneContainer etc.)
       * foi confirmado inspecionando o HTML renderizado em produção — mesmo
       * princípio de `[class*="..."]` usado acima, só que numa lib de CSS
       * diferente por baixo. Se uma atualização futura do Decap mudar esses
       * nomes, o pior que acontece é o painel voltar a aparecer com a cor
       * "de fábrica" dele — nada quebra, é só cosmético (mesma garantia da
       * tela de login).
       *
       * `!important` em quase tudo aqui não é descuido: o Decap injeta o
       * CSS dele via JavaScript (Emotion), depois que essa tag <style>
       * já existe no <head> — ou seja, sem `!important` o "empate" de
       * especificidade seria decidido pela ORDEM de inserção, e a regra
       * dele (inserida depois) venceria a nossa. É a mesma razão pela qual
       * o bloco de login acima também usa `!important` bastante.
       *
       * Paleta: os mesmos tokens de cor do tema escuro do site
       * (src/styles.css, bloco `:root`/tier 1) copiados em oklch() puro —
       * essa tela não passa pelo Tailwind, então os valores são colados
       * direto em vez de reaproveitados via classe utilitária.
       *   --af-bg:        oklch(0.14 0.004 250)   → fundo (igual --background)
       *   --af-surface:   oklch(0.175 0.005 250)  → cartões/inputs (--surface)
       *   --af-surface-2: oklch(0.215 0.006 250)  → hover/секundário (--surface-2)
       *   --af-fg:        oklch(0.97 0.002 250)   → texto principal (--foreground)
       *   --af-muted:     oklch(0.66 0.008 250)   → texto apagado (--muted-foreground)
       *   --af-border:    oklch(1 0 0 / 8%)        → borda fraca (--border)
       *   --af-border-2:  oklch(1 0 0 / 16%)       → borda forte (--border-strong)
       * ===================================================================== */

      :root {
        --af-bg: oklch(0.14 0.004 250);
        --af-surface: oklch(0.175 0.005 250);
        --af-surface-2: oklch(0.215 0.006 250);
        --af-fg: oklch(0.97 0.002 250);
        --af-muted: oklch(0.66 0.008 250);
        --af-border: oklch(1 0 0 / 8%);
        --af-border-2: oklch(1 0 0 / 16%);
        --af-glow: 0 0 0 1px oklch(1 0 0 / 35%), 0 8px 40px -12px oklch(1 0 0 / 35%);
      }

      /* ---- Cabeçalho fixo (abas Conteúdos/Mídia, link do site, avatar) ---- */
      [class*="AppHeader-css"] {
        background: var(--af-bg) !important;
        border-bottom: 1px solid var(--af-border) !important;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif !important;
      }
      [class*="AppHeaderNavList"] [class*="AppHeaderButton"],
      [class*="AppHeaderNavList"] [class*="AppHeaderNavLink"] {
        color: var(--af-muted) !important;
        font-weight: 600 !important;
        letter-spacing: 0.02em;
      }
      [class*="AppHeaderNavList"] [class*="AppHeaderButton"].header-link-active,
      [class*="AppHeaderNavList"] [class*="AppHeaderNavLink"].header-link-active {
        color: var(--af-fg) !important;
      }
      /* link "allframes.vercel.app" → some o texto original (font-size: 0,
         sem apagar o elemento) e escreve "Admin" no lugar via ::after — o
         <a> continua sendo o mesmo elemento, com o mesmo href/onClick do
         Decap, então clicar nele ainda leva de volta ao site publicado. */
      [class*="AppHeaderSiteLink"] {
        font-size: 0 !important;
        color: var(--af-muted) !important;
        text-decoration: none !important;
      }
      [class*="AppHeaderSiteLink"]::after {
        content: "Admin";
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.03em;
      }
      [class*="AppHeaderSiteLink"]:hover {
        color: var(--af-fg) !important;
      }
      [class*="AvatarDropdownButton"] {
        border-radius: 999px !important;
      }

      /* ---- Barra lateral (Coleções + busca) ---- */
      [class*="SidebarContainer"] {
        background: var(--af-bg) !important;
        border-right: 1px solid var(--af-border) !important;
      }
      [class*="SidebarHeading"] {
        color: var(--af-muted) !important;
        font-size: 11px !important;
        font-weight: 700 !important;
        letter-spacing: 0.1em !important;
        text-transform: uppercase;
      }
      [class*="SearchContainer"],
      [class*="InputContainer"] {
        background: var(--af-surface) !important;
        border: 1px solid var(--af-border) !important;
      }
      [class*="SearchInput"] {
        background: transparent !important;
        color: var(--af-fg) !important;
      }
      [class*="SidebarContainer"] a {
        color: var(--af-fg) !important;
      }

      /* ---- Área principal + topo da coleção ("Textos do site") ----
       * Essa área é bem mais larga que a lista de cartões (o Decap não
       * estica os cartões pra ocupar a tela toda) — sobra um espaço vazio
       * grande à direita. Num fundo branco isso nem se nota; virando fundo
       * escuro sólido, esse vazio parece um retângulo preto quebrado. Pra
       * não parecer erro, ele ganha a MESMA textura (grid técnico + grain)
       * do resto do site escuro — reproduzida de src/styles.css, igual já
       * foi feito na tela de login acima. */
      [class*="AppMainContainer"],
      [class*="CollectionContainer"],
      [class*="CollectionMain"] {
        background-color: var(--af-bg) !important;
        background-image:
          radial-gradient(oklch(1 0 0 / 14%) 0.4px, transparent 0.4px),
          linear-gradient(oklch(1 0 0 / 5%) 1px, transparent 1px),
          linear-gradient(to right, oklch(1 0 0 / 5%) 1px, transparent 1px) !important;
        background-size:
          5px 5px,
          56px 56px,
          56px 56px !important;
        background-position:
          2.5px 2.5px,
          0 0,
          0 0 !important;
      }
      [class*="CollectionTopContainer"] {
        background: var(--af-bg) !important;
        border-bottom: 1px solid var(--af-border) !important;
      }
      [class*="CollectionTopHeading"] {
        color: var(--af-fg) !important;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif !important;
      }
      [class*="CollectionTopRow"] p {
        color: var(--af-muted) !important;
      }

      /* ---- Cartões da listagem ("Cabeçalho (menu no topo)" etc.) ---- */
      [class*="ListCard"] {
        background: var(--af-surface) !important;
        border: 1px solid var(--af-border) !important;
        border-radius: 12px !important;
        transition:
          border-color 0.2s ease,
          transform 0.2s ease;
      }
      [class*="ListCard"]:hover {
        border-color: var(--af-border-2) !important;
        transform: translateY(-1px);
      }
      [class*="ListCardTitle"] {
        color: var(--af-fg) !important;
        font-weight: 600 !important;
      }

      /* ---- Tela de edição: barra de ferramentas (Publicado, Salvar...) ---- */
      [class*="ToolbarContainer"] {
        background: var(--af-bg) !important;
        border-bottom: 1px solid var(--af-border) !important;
      }
      [class*="ToolbarContainer"] * {
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif !important;
      }
      [class*="ToolbarButton"] {
        color: var(--af-fg) !important;
      }
      /* selo "Publicado" — vira um badge discreto em vez do verde padrão do
         Decap, seguindo a mesma linguagem visual "pill" usada nos botões do
         site (ver Hero.tsx, botão principal). */
      [class*="PublishedButton"] {
        background: var(--af-surface-2) !important;
        border: 1px solid var(--af-border-2) !important;
        border-radius: 999px !important;
      }

      /* ---- Tela de edição: coluna de campos (esquerda) ---- */
      [class*="EditorContainer"] {
        background: var(--af-bg) !important;
      }
      [class*="ControlPaneContainer"] {
        background: var(--af-bg) !important;
      }
      [class*="ControlPaneContainer"] label {
        color: var(--af-muted) !important;
        font-weight: 700 !important;
        letter-spacing: 0.06em;
      }
      [class*="ControlPaneContainer"] input,
      [class*="ControlPaneContainer"] textarea,
      [class*="ControlPaneContainer"] select {
        background: var(--af-surface) !important;
        color: var(--af-fg) !important;
        border: 1px solid var(--af-border) !important;
        border-radius: 8px !important;
      }
      /* mesmo "glow" de foco usado nos inputs do site de verdade
         (--shadow-glow em src/styles.css) — reaproveitado aqui em oklch()
         puro pra a mesma sensação ao digitar. */
      [class*="ControlPaneContainer"] input:focus,
      [class*="ControlPaneContainer"] textarea:focus,
      [class*="ControlPaneContainer"] select:focus {
        outline: none !important;
        box-shadow: var(--af-glow) !important;
        border-color: transparent !important;
      }

      /* ---- Tela de edição: painel de pré-visualização (direita) ----
         Sem preview customizado (registerPreviewTemplate) configurado, o
         Decap mostra um preview genérico claro — em vez de forçar isso pra
         escuro (exigiria mexer no <iframe>, fora do escopo de um CSS
         "por cima"), a moldura ganha respiro/contraste como se fosse uma
         folha de papel sobre a mesa escura — leitura intencional, não
         acidente. */
      [class*="PreviewPaneContainer"] {
        background: var(--af-surface) !important;
        border-left: 1px solid var(--af-border) !important;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // O Decap não tem um jeito nativo (via config.yml) de adicionar
      // título/frase/descrição na tela de login — só a logo é configurável.
      // Então observamos o DOM até a seção de login aparecer e inserimos
      // esses 3 elementos como IRMÃOS dos que o Decap já renderiza (entre a
      // logo e o botão), sem substituir, clonar ou desmontar nada que o
      // Decap controla. O botão de login e o link "Voltar ao site" continuam
      // sendo exatamente os elementos originais do Decap, com o mesmo
      // onClick/href de sempre — só o texto do botão é encurtado ("Entrar
      // com o GitHub" → "Entrar com GitHub"), trocando apenas o nó de texto,
      // nunca o elemento em si.
      (function () {
        function enhance(section) {
          if (section.dataset.afEnhanced) return;

          var button = section.querySelector('[class*="LoginButton"]');
          if (!button) return; // ainda não renderizou tudo, tenta de novo depois

          section.dataset.afEnhanced = "true";

          var title = document.createElement("h1");
          title.className = "af-login-title";
          title.textContent = "Central do Administrador";

          var tagline = document.createElement("p");
          tagline.className = "af-login-tagline";
          tagline.textContent = "Acesso restrito ao ambiente administrativo.";

          var desc = document.createElement("p");
          desc.className = "af-login-desc";
          desc.textContent =
            "Ambiente reservado para administradores, onde é possível gerenciar conteúdos, informações e recursos da plataforma em um único lugar, com praticidade, organização e controle.";

          button.insertAdjacentElement("beforebegin", title);
          button.insertAdjacentElement("beforebegin", tagline);
          button.insertAdjacentElement("beforebegin", desc);

          // encurta o texto do botão sem recriar o elemento (preserva o
          // onClick que o Decap já anexou nele)
          for (var i = 0; i < button.childNodes.length; i++) {
            var node = button.childNodes[i];
            if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim()) {
              node.nodeValue = "Entrar com GitHub";
              break;
            }
          }
        }

        function scan() {
          var section = document.querySelector('[class*="StyledAuthenticationPage"]');
          if (section) {
            // Liga o tema escuro (ver bloco html.af-login-screen no <style>)
            // só enquanto essa seção existir — ela some assim que o login dá
            // certo, então isso nunca fica ligado dentro do editor.
            document.documentElement.classList.add("af-login-screen");
            enhance(section);
          } else {
            document.documentElement.classList.remove("af-login-screen");
          }
        }

        scan();
        new MutationObserver(scan).observe(document.body, { childList: true, subtree: true });
      })();

      // Traduz mensagens de erro pontuais que o Decap dispara direto do
      // backend do GitHub (avisos tipo "sua conta não tem acesso ao repo")
      // — essas NÃO fazem parte do arquivo de idioma (locale: "pt" no
      // config.yml só traduz a interface fixa, tipo botões e menus), então
      // aparecem sempre em inglês, mesmo com o site todo em português.
      // Solução: observa o DOM e, sempre que um desses textos exatos
      // aparecer em qualquer lugar da página, troca só o texto (nó de
      // texto), sem recriar/mover o elemento — o toast continua sendo o
      // componente de verdade do Decap (com o mesmo botão de fechar, o
      // mesmo tempo de sumiço automático etc.), só a frase muda de idioma.
      // Pra adicionar mais mensagens no futuro, é só acrescentar uma linha
      // nesse dicionário com o texto em inglês exato (copie do toast que
      // aparecer) e a tradução.
      (function () {
        var DICTIONARY = {
          "Your GitHub user account does not have access to this repo.":
            "Você não tem permissão para acessar essa página.",
        };

        function translateTextNodes(node) {
          if (node.nodeType === Node.TEXT_NODE) {
            var text = node.nodeValue.trim();
            if (DICTIONARY[text]) node.nodeValue = DICTIONARY[text];
            return;
          }
          if (node.nodeType !== Node.ELEMENT_NODE) return;
          var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
          var textNode;
          while ((textNode = walker.nextNode())) {
            var trimmed = textNode.nodeValue.trim();
            if (DICTIONARY[trimmed]) textNode.nodeValue = DICTIONARY[trimmed];
          }
        }

        new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(translateTextNodes);
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();

      // Depois de qualquer erro de login (credenciais recusadas, sem acesso
      // ao repo etc.), o botão "Entrar com GitHub" fica travado/sem reação —
      // isso é um comportamento do próprio Decap (o estado interno de
      // "carregando" não é limpo quando a popup fecha com erro) e não tem
      // como consertar por dentro sem reescrever a biblioteca. A saída mais
      // simples e segura é reproduzir o que o F5 já resolve: assim que um
      // toast de erro aparece (react-toastify, usado por baixo do Decap, tem
      // classe "Toastify__toast--error" — nome estável, não muda a cada
      // build como as classes do restante da tela), recarrega a página
      // sozinho depois de alguns segundos, tempo suficiente pra pessoa ler a
      // mensagem antes da tela reiniciar com o botão liberado de novo.
      (function () {
        var reloadScheduled = false;

        function scheduleReload(delayMs) {
          if (reloadScheduled) return;
          reloadScheduled = true;
          setTimeout(function () {
            location.reload();
          }, delayMs);
        }

        function looksLikeErrorToast(el) {
          if (!el.className || typeof el.className !== "string") return false;
          return el.className.indexOf("Toastify__toast--error") !== -1;
        }

        new MutationObserver(function (mutations) {
          mutations.forEach(function (m) {
            m.addedNodes.forEach(function (node) {
              if (node.nodeType !== Node.ELEMENT_NODE) return;
              var isError =
                looksLikeErrorToast(node) ||
                (node.querySelector && node.querySelector('[class*="Toastify__toast--error"]'));
              if (isError) scheduleReload(4000);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
